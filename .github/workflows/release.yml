name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: money-miner-backend/go.sum
      - name: build worker matrix + server + wasm
        run: make release VERSION=${GITHUB_REF_NAME}
      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/money-miner-worker_*
            dist/money-miner-server_*
            dist/sha256sums.txt
            money-miner-frontend/public/wasm/browserhash.wasm
            money-miner-frontend/public/wasm/wasm_exec.js
          generate_release_notes: true

  images:
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: money-miner-backend/go.sum
      - name: build wasm into the frontend context
        run: make build-wasm VERSION=${GITHUB_REF_NAME}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: server image
        uses: docker/build-push-action@v6
        with:
          context: money-miner-backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/thecsdoctor/money-miner-server:${{ github.ref_name }}
            ghcr.io/thecsdoctor/money-miner-server:latest
          build-args: VERSION=${{ github.ref_name }}
      - name: frontend image
        uses: docker/build-push-action@v6
        with:
          context: money-miner-frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/thecsdoctor/money-miner-frontend:${{ github.ref_name }}
            ghcr.io/thecsdoctor/money-miner-frontend:latest
