# money-miner frontend container: SPA with history fallback. The host nginx
# edge proxies /api/ to the backend; this server only serves static assets.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed vite assets: long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # env.js is rendered per container start — never cache it
    location = /env.js {
        add_header Cache-Control "no-store";
    }
}
